<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delhi Air Quality Monitor - Live Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 5px;
            font-size: 2.2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            color: rgba(255,255,255,0.95);
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        
        .aqi-legend {
            background: white;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .legend-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .legend-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85em;
        }
        
        .legend-color {
            width: 30px;
            height: 20px;
            border-radius: 4px;
        }
        
        .weather-card {
            background: white;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .weather-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        
        .weather-label {
            font-size: 0.8em;
            opacity: 0.9;
            margin-bottom: 3px;
        }
        
        .weather-value {
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .stations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }
        
        .station-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        
        .station-card:hover {
            transform: translateY(-3px);
        }
        
        .station-name {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        
        .aqi-display {
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin: 10px 0;
            color: white;
        }
        
        .aqi-value {
            font-size: 2.5em;
            font-weight: bold;
            margin: 5px 0;
        }
        
        .aqi-category {
            font-size: 1em;
            margin: 3px 0;
        }
        
        .pollutants {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        
        .pollutant {
            background: #f5f5f5;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
        }
        
        .pollutant-label {
            font-size: 0.75em;
            color: #666;
            margin-bottom: 2px;
        }
        
        .pollutant-value {
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
        }
        
        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .chart-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .chart-title {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
            font-weight: bold;
        }
        
        .button {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            margin: 15px auto;
            display: block;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0,0,0,0.3);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .timestamp {
            text-align: center;
            color: white;
            margin-top: 15px;
            opacity: 0.95;
            font-size: 0.95em;
        }
        
        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }
        
        @media (max-width: 768px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
            
            .stations-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Delhi Air Quality Monitor</h1>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading environmental data...</p>
        </div>
        
        <div id="content" style="display: none;">
            <!-- AQI Legend -->
            <div class="aqi-legend">
                <div class="legend-title">📊 AQI Level Guide</div>
                <div class="legend-items">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #00e400;"></div>
                        <span>0-50: Good</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ffff00;"></div>
                        <span>51-100: Moderate</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ff7e00;"></div>
                        <span>101-150: Unhealthy (Sensitive)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ff0000;"></div>
                        <span>151-200: Unhealthy</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #8f3f97;"></div>
                        <span>201-300: Very Unhealthy</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #7e0023;"></div>
                        <span>300+: Hazardous</span>
                    </div>
                </div>
            </div>
            
            <!-- Stations -->
            <h2 style="color: white; margin: 15px 0 10px; text-align: center; font-size: 1.3em;">📍 Metro Station Monitoring</h2>
            <div class="stations-grid" id="stationsGrid"></div>
            
            <!-- Charts -->
            <div class="charts-container">
                <div class="chart-card">
                    <div class="chart-title">📊 Station AQI Comparison</div>
                    <canvas id="barChart"></canvas>
                </div>
                <div class="chart-card">
                    <div class="chart-title">☠️ Hazardous Gases Concentration</div>
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
            
            <div class="timestamp" id="timestamp"></div>
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
    </div>
    
    <script>
        let barChart = null;
        let pieChart = null;
        
        async function fetchData() {
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');
            const error = document.getElementById('error');
            
            loading.style.display = 'block';
            content.style.display = 'none';
            error.style.display = 'none';
            
            try {
                const response = await fetch('/api/aqi');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    displayStations(data.stations);
                    updateBarChart(data.stations);
                    updatePieChart(data.stations);
                    document.getElementById('timestamp').textContent = 
                        `⏰ Last updated: ${data.timestamp}`;
                    
                    loading.style.display = 'none';
                    content.style.display = 'block';
                } else {
                    throw new Error(data.message || 'Failed to fetch data');
                }
            } catch (err) {
                error.style.display = 'block';
                error.textContent = '❌ Error: ' + err.message;
                loading.style.display = 'none';
            }
        }
        
        function displayStations(stations) {
            const grid = document.getElementById('stationsGrid');
            grid.innerHTML = stations.map(station => `
                <div class="station-card">
                    <div class="station-name">${station.name}</div>
                    <div class="aqi-display" style="background: ${station.color};">
                        <div class="aqi-value">${station.aqi}</div>
                        <div class="aqi-category">${station.category}</div>
                    </div>
                    <div class="pollutants">
                        <div class="pollutant">
                            <div class="pollutant-label">PM2.5</div>
                            <div class="pollutant-value">${station.pm25}</div>
                        </div>
                        <div class="pollutant">
                            <div class="pollutant-label">PM10</div>
                            <div class="pollutant-value">${station.pm10}</div>
                        </div>
                        <div class="pollutant">
                            <div class="pollutant-label">O₃</div>
                            <div class="pollutant-value">${station.o3}</div>
                        </div>
                        <div class="pollutant">
                            <div class="pollutant-label">NO₂</div>
                            <div class="pollutant-value">${station.no2}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function updateBarChart(stations) {
            const ctx = document.getElementById('barChart').getContext('2d');
            
            if (barChart) {
                barChart.destroy();
            }
            
            barChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: stations.map(s => s.name),
                    datasets: [{
                        label: 'AQI Level',
                        data: stations.map(s => s.aqi),
                        backgroundColor: stations.map(s => s.color),
                        borderWidth: 0,
                        barThickness: 40
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        x: {
                            beginAtZero: true,
                            max: 200,
                            ticks: {
                                stepSize: 25
                            },
                            grid: {
                                color: 'rgba(0,0,0,0.1)'
                            }
                        },
                        y: {
                            grid: {
                                display: false
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }
        
        function updatePieChart(stations) {
            const ctx = document.getElementById('pieChart').getContext('2d');
            
            if (pieChart) {
                pieChart.destroy();
            }
            
            pieChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: stations.map(s => s.name),
                    datasets: [{
                        data: stations.map(s => s.aqi),
                        backgroundColor: stations.map(s => s.color),
                        borderWidth: 3,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 15,
                                font: {
                                    size: 11
                                }
                            }
            // Calculate average gas concentrations across all stations
            let totalPM25 = 0, totalPM10 = 0, totalO3 = 0, totalNO2 = 0, totalCO = 0;
            let count = 0;
            
            stations.forEach(station => {
                if (station.pm25 !== 'N/A') totalPM25 += parseFloat(station.pm25);
                if (station.pm10 !== 'N/A') totalPM10 += parseFloat(station.pm10);
                if (station.o3 !== 'N/A') totalO3 += parseFloat(station.o3);
                if (station.no2 !== 'N/A') totalNO2 += parseFloat(station.no2);
                if (station.co !== 'N/A') totalCO += parseFloat(station.co);
                count++;
            });
            
            const avgPM25 = (totalPM25 / count).toFixed(1);
            const avgPM10 = (totalPM10 / count).toFixed(1);
            const avgO3 = (totalO3 / count).toFixed(1);
            const avgNO2 = (totalNO2 / count).toFixed(1);
            const avgCO = (totalCO / count).toFixed(1);
            
            pieChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['PM2.5 (Fine Particles)', 'PM10 (Dust)', 'O₃ (Ozone)', 'NO₂ (Nitrogen Dioxide)', 'CO (Carbon Monoxide)'],
                    datasets: [{
                        data: [avgPM25, avgPM10, avgO3, avgNO2, avgCO],
                        backgroundColor: [
                            '#FF6384',
                            '#36A2EB', 
                            '#FFCE56',
                            '#4BC0C0',
                            '#9966FF'
                        ],
                        borderWidth: 3,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                padding: 12,
                                font: {
                                    size: 11
                                },
                                generateLabels: function(chart) {
                                    const data = chart.data;
                                    return data.labels.map((label, i) => ({
                                        text: `${label}: ${data.datasets[0].data[i]} μg/m³`,
                                        fillStyle: data.datasets[0].backgroundColor[i],
                                        hidden: false,
                                        index: i
                                    }));
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.label + ': ' + context.parsed + ' μg/m³';
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            color: rgba(255,255,255,0.9);

            margin-bottom: 30px;
            font-size: 1.2em;
        }
        
        .weather-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .weather-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

        }
        
        .weather-label {

        }
        
        .weather-value {

        }
        
        .stations-grid {

            gap: 20px;

        }
        
        .station-card {

            transition: transform 0.3s;
        }
        
        .station-card:hover {
            transform: translateY(-5px);
        }
        
        .station-name {
            font-size: 1.3em;

        }
        
        .aqi-display {
            padding: 30px;

            text-align: center;
            margin: 15px 0;
            color: white;
        }
        
        .aqi-value {
            font-size: 3.5em;

            margin: 10px 0;
        }
        
        .aqi-category {
            font-size: 1.3em;

        }
        
        .pollutants {

        }
        
        .pollutant {
            background: #f5f5f5;

<body>
    <div class="container">
        <h1>🌍 Delhi Air Quality Monitor</h1>
        <p class="subtitle">Comprehensive Environmental Dashboard</p>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading environmental data...</p>
        </div>
        
        <div id="content" style="display: none;">
            <div class="weather-card">
                <h2 style="color: #333; margin-bottom: 15px;">🌤️ Weather Conditions</h2>
                <div class="weather-grid" id="weatherGrid"></div>
            </div>
            
            <h2 style="color: white; margin: 20px 0 15px; text-align: center;">📍 Metro Station Monitoring</h2>
            <div class="stations-grid" id="stationsGrid"></div>
            
            <div class="chart-container">
                <h2 style="color: #333; margin-bottom: 20px;">📊 Station Comparison</h2>
                <canvas id="aqiChart"></canvas>
            </div>
            
            <button class="button" onclick="fetchData()">🔄 Refresh Data</button>
            
            <div class="timestamp" id="timestamp"></div>
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
    </div>
    
    <script>
        let aqiChart = null;
        
        async function fetchData() {
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');
            const error = document.getElementById('error');
            
            loading.style.display = 'block';
            content.style.display = 'none';
            error.style.display = 'none';
            
            try {
                const response = await fetch('/api/aqi');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    displayWeather(data.weather);
                    displayStations(data.stations);
                    updateChart(data.stations);
                    document.getElementById('timestamp').textContent = 
                        `Last updated: ${data.timestamp}`;
                    
                    loading.style.display = 'none';
                    content.style.display = 'block';
                } else {
                    throw new Error(data.message || 'Failed to fetch data');
                }
            } catch (err) {
                error.style.display = 'block';
                error.textContent = 'Error: ' + err.message;
                loading.style.display = 'none';
            }
        }
        
        function displayWeather(weather) {
            const grid = document.getElementById('weatherGrid');
            grid.innerHTML = `
                <div class="weather-item">
                    <div class="weather-label">Temperature</div>
                    <div class="weather-value">${weather.temperature}°C</div>
                </div>
                <div class="weather-item">
                    <div class="weather-label">Humidity</div>
                    <div class="weather-value">${weather.humidity}%</div>
                </div>
                <div class="weather-item">
                    <div class="weather-label">Wind Speed</div>
                    <div class="weather-value">${weather.wind_speed} km/h</div>
                </div>
                <div class="weather-item">
                    <div class="weather-label">Wind Direction</div>
                    <div class="weather-value">${weather.wind_direction}°</div>
                </div>
            `;
        }
        
        function displayStations(stations) {
            const grid = document.getElementById('stationsGrid');
            grid.innerHTML = stations.map(station => `
                <div class="station-card">
                    <div class="station-name">${station.name}</div>
                    <div class="aqi-display" style="background: ${station.color};">
                        <div class="aqi-value">${station.aqi}</div>
                        <div class="aqi-category">${station.category}</div>
                    </div>
                    <div class="pollutants">
                        <div class="pollutant">
                            <div class="pollutant-label">PM2.5</div>
                            <div class="pollutant-value">${station.pm25}</div>
                        </div>
                        <div class="pollutant">
                            <div class="pollutant-label">PM10</div>
                            <div class="pollutant-value">${station.pm10}</div>
                        </div>
                        <div class="pollutant">
                            <div class="pollutant-label">O₃</div>
                            <div class="pollutant-value">${station.o3}</div>
                        </div>
                        <div class="pollutant">
                            <div class="pollutant-label">NO₂</div>
                            <div class="pollutant-value">${station.no2}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function updateChart(stations) {
            const ctx = document.getElementById('aqiChart').getContext('2d');
            
            if (aqiChart) {
                aqiChart.destroy();
            }
            
            aqiChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: stations.map(s => s.name),
                    datasets: [{
                        label: 'AQI Value',
                        data: stations.map(s => s.aqi),
                        backgroundColor: stations.map(s => s.color),
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'AQI Value'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }
        
        window.addEventListener('load', fetchData);
        setInterval(fetchData, 300000); // Refresh every 5 minutes
    </script>
</body>
</html>
