<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delhi Air Quality Monitor - Comprehensive Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            color: rgba(255,255,255,0.9);
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.2em;
        }
        
        .weather-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .weather-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .weather-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }
        
        .weather-value {
            font-size: 2em;
            font-weight: bold;
        }
        
        .stations-grid {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        
        .stations-grid::-webkit-scrollbar {
            height: 8px;
        }
        
        .stations-grid::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }
        
        .stations-grid::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.5);
            border-radius: 10px;
        }
        
        .station-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            min-width: 200px;
            flex-shrink: 0;
        }
        
        .station-card:hover {
            transform: translateY(-3px);
        }
        
        .station-name {
            font-size: 1em;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        
        .aqi-display {
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin: 8px 0;
            color: white;
        }
        
        .aqi-value {
            font-size: 2.2em;
            font-weight: bold;
            margin: 3px 0;
        }
        
        .aqi-category {
            font-size: 0.9em;
            margin: 2px 0;
        }
        
        .pollutants {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin-top: 8px;
        }
        
        .pollutant {
            background: #f5f5f5;
            padding: 6px;
            border-radius: 6px;
            text-align: center;
        }
        
        .pollutant-label {
            font-size: 0.7em;
            color: #666;
            margin-bottom: 2px;
        }
        
        .pollutant-value {
            font-size: 1em;
            font-weight: bold;
            color: #333;
        }
        
        .refresh-container {
            text-align: center;
            margin: 20px 0;
        }
        
        .refresh-button {
            background: linear-gradient(135deg, #00e400, #00b300);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0, 228, 0, 0.4);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .refresh-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 25px rgba(0, 228, 0, 0.5);
            background: linear-gradient(135deg, #00ff00, #00cc00);
        }
        
        .refresh-button:active {
            transform: translateY(0) scale(0.98);
        }
        
        .refresh-icon {
            font-size: 1.3em;
            animation: spin 2s linear infinite paused;
        }
        
        .refresh-button:hover .refresh-icon {
            animation-play-state: running;
        }
        
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        
        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .button {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            margin: 20px auto;
            display: block;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0,0,0,0.3);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .timestamp {
            text-align: center;
            color: white;
            margin-top: 20px;
            opacity: 0.9;
        }
        
        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }
            
            .station-card {
                min-width: 180px;
            }
            
            .refresh-button {
                padding: 12px 30px;
                font-size: 1em;
            }
            
            .chart-container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Delhi Air Quality Monitor</h1>
        <p class="subtitle">Comprehensive Environmental Dashboard</p>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading environmental data...</p>
        </div>
        
        <div id="content" style="display: none;">
            <div class="weather-card">
                <h2 style="color: #333; margin-bottom: 15px;">🌤️ Weather Conditions</h2>
                <div class="weather-grid" id="weatherGrid"></div>
            </div>
            
            <div class="refresh-container">
                <button class="refresh-button" onclick="fetchData()">
                    <span class="refresh-icon">🔄</span>
                    <span>Refresh Data</span>
                </button>
            </div>
            
            <h2 style="color: white; margin: 20px 0 15px; text-align: center;">📍 Metro Station Monitoring</h2>
            <div class="stations-grid" id="stationsGrid"></div>
            
            <div class="chart-container">
                <h2 style="color: #333; margin-bottom: 20px;">📊 Station Comparison</h2>
                <canvas id="aqiChart"></canvas>
            </div>
            
            <div class="timestamp" id="timestamp"></div>
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
    </div>
    
    <script>
        let aqiChart = null;
        
        async function fetchData() {
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');
            const error = document.getElementById('error');
            
            loading.style.display = 'block';
            content.style.display = 'none';
            error.style.display = 'none';
            
            try {
                const response = await fetch('/api/aqi');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    displayWeather(data.weather);
                    displayStations(data.stations);
                    updateChart(data.stations);
                    document.getElementById('timestamp').textContent = 
                        `Last updated: ${data.timestamp}`;
                    
                    loading.style.display = 'none';
                    content.style.display = 'block';
                } else {
                    throw new Error(data.message || 'Failed to fetch data');
                }
            } catch (err) {
                error.style.display = 'block';
                error.textContent = 'Error: ' + err.message;
                loading.style.display = 'none';
            }
        }
        
        function displayWeather(weather) {
            const grid = document.getElementById('weatherGrid');
            grid.innerHTML = `
                <div class="weather-item">
                    <div class="weather-label">Temperature</div>
                    <div class="weather-value">${weather.temperature}°C</div>
                </div>
                <div class="weather-item">
                    <div class="weather-label">Humidity</div>
                    <div class="weather-value">${weather.humidity}%</div>
                </div>
                <div class="weather-item">
                    <div class="weather-label">Wind Speed</div>
                    <div class="weather-value">${weather.wind_speed} km/h</div>
                </div>
                <div class="weather-item">
                    <div class="weather-label">Wind Direction</div>
                    <div class="weather-value">${weather.wind_direction}°</div>
                </div>
            `;
        }
        
        function displayStations(stations) {
            const grid = document.getElementById('stationsGrid');
            grid.innerHTML = stations.map(station => `
                <div class="station-card">
                    <div class="station-name">${station.name}</div>
                    <div class="aqi-display" style="background: ${station.color};">
                        <div class="aqi-value">${station.aqi}</div>
                        <div class="aqi-category">${station.category}</div>
                    </div>
                    <div class="pollutants">
                        <div class="pollutant">
                            <div class="pollutant-label">PM2.5</div>
                            <div class="pollutant-value">${station.pm25}</div>
                        </div>
                        <div class="pollutant">
                            <div class="pollutant-label">PM10</div>
                            <div class="pollutant-value">${station.pm10}</div>
                        </div>
                        <div class="pollutant">
                            <div class="pollutant-label">O₃</div>
                            <div class="pollutant-value">${station.o3}</div>
                        </div>
                        <div class="pollutant">
                            <div class="pollutant-label">NO₂</div>
                            <div class="pollutant-value">${station.no2}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function updateChart(stations) {
            const ctx = document.getElementById('aqiChart').getContext('2d');
            
            if (aqiChart) {
                aqiChart.destroy();
            }
            
            aqiChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: stations.map(s => s.name),
                    datasets: [{
                        label: 'AQI Value',
                        data: stations.map(s => s.aqi),
                        backgroundColor: stations.map(s => s.color),
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'AQI Value'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }
        
        window.addEventListener('load', fetchData);
        setInterval(fetchData, 300000); // Refresh every 5 minutes
    </script>
</body>
</html>
